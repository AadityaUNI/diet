
services:
  backend: 
    build: ./backend
    ports: 
     - 8000:8000
    env_file:
     - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - 8080:8080
    depends_on:
      backend: 
        condition: service_healthy

  